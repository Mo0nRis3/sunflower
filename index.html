<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<title>A little invitation 🌻</title>
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Lora:wght@500&display=swap"
		/>
		<style>
			:root {
				--bg1: #fff3cf;
				--bg2: #ffd36b;
				--hint: #7a4a1d;
				--cu: #b4501e;
				--paper: #fffaf0;
				--ew: min(84vw, 400px);
				--cw: min(90vw, 440px);
				--ch: min(76svh, 600px);
				box-sizing: border-box;
				padding-top: env(safe-area-inset-top, 0px);
				padding-bottom: env(safe-area-inset-bottom, 0px);
			}
			@media (prefers-color-scheme: dark) {
				:root:not([data-theme="light"]) {
					--bg1: #4d2c12;
					--bg2: #1e1108;
					--hint: #ffe39a;
				}
			}
			:root[data-theme="dark"] {
				--bg1: #4d2c12;
				--bg2: #1e1108;
				--hint: #ffe39a;
			}
			html {
				scroll-padding-top: env(safe-area-inset-top, 0px);
			}
			html,
			body {
				height: 100%;
				margin: 0;
			}
			body {
				display: grid;
				place-items: center;
				overflow: hidden;
				background-color: var(--bg2);
				background-image: radial-gradient(
					120% 90% at 50% 0,
					var(--bg1),
					var(--bg2)
				);
				font-family: Lora, Georgia, serif;
				color: #4a2a12;
				-webkit-tap-highlight-color: transparent;
				user-select: none;
				-webkit-user-select: none;
			}
			body > * {
				grid-area: 1/1;
			}
			.fl {
				position: fixed;
				top: -70px;
				z-index: 0;
				opacity: 0.45;
				aspect-ratio: 1;
				pointer-events: none;
				animation: fall linear infinite;
			}
			@keyframes fall {
				to {
					transform: translateY(calc(100svh + 140px)) rotate(360deg);
				}
			}
			@media (prefers-reduced-motion: reduce) {
				.fl {
					display: none;
				}
			}
			#env {
				position: relative;
				top: 0;
				width: var(--ew);
				height: calc(var(--ew) * 0.66);
				cursor: grab;
				touch-action: none;
				outline: none;
				transition:
					top 0.35s,
					opacity 1.1s;
			}
			#env:focus-visible {
				outline: 3px solid var(--cu);
				outline-offset: 8px;
			}
			#env.drag {
				transition: none;
				cursor: grabbing;
			}
			#env.gone {
				top: 80svh;
				opacity: 0;
				transition:
					top 1.1s cubic-bezier(0.5, 0, 0.9, 0.5),
					opacity 1.1s;
			}
			.p {
				position: absolute;
				inset: 0;
				border-radius: 6px;
			}
			.eb {
				background: #dfae52;
				z-index: 1;
				box-shadow: 0 22px 44px rgba(60, 30, 0, 0.38);
			}
			.ef {
				background: #f1cd85;
				z-index: 3;
				clip-path: polygon(0 0, 50% 56%, 100% 0, 100% 100%, 0 100%);
			}
			.fp {
				background: #e6b863;
				bottom: auto;
				height: 58%;
				clip-path: polygon(0 0, 100% 0, 50% 100%);
				transform-origin: top;
				transition: transform 0.55s;
				z-index: 4;
			}
			.open .fp {
				transform: perspective(700px) rotateX(180deg);
				z-index: 1;
			}
			.seal {
				position: absolute;
				width: 21%;
				aspect-ratio: 1;
				left: 50%;
				top: 51%;
				translate: -50% -50%;
				z-index: 5;
				transition: opacity 0.3s;
				filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.4));
			}
			.open .seal {
				opacity: 0;
			}
			.to {
				position: absolute;
				left: 0;
				right: 0;
				bottom: 10%;
				z-index: 4;
				text-align: center;
				font:
					700 clamp(1.4rem, 6vw, 1.9rem) Caveat,
					"Segoe Print",
					cursive;
				color: var(--cu);
			}
			#hint {
				align-self: end;
				margin-bottom: 8svh;
				text-align: center;
				font:
					700 1.5rem Caveat,
					"Segoe Print",
					cursive;
				color: var(--hint);
				transition: opacity 0.4s;
				pointer-events: none;
			}
			#hint i {
				display: block;
				font-style: normal;
				font-size: 1.9rem;
				animation: up 1.4s ease-in-out infinite;
			}
			@keyframes up {
				50% {
					transform: translateY(-10px);
				}
			}
			.card {
				position: relative;
				z-index: 2;
				width: calc(var(--ew) * 0.8);
				height: calc(var(--ew) * 0.44);
				opacity: 0;
				pointer-events: none;
				transition:
					width 1s cubic-bezier(0.3, 0.8, 0.2, 1),
					height 1s cubic-bezier(0.3, 0.8, 0.2, 1),
					transform 0.6s ease-out,
					opacity 0.3s;
			}
			.card.pull {
				opacity: 1;
				transform: translateY(calc(var(--ew) * -0.28));
			}
			.card.out {
				width: var(--cw);
				height: var(--ch);
				transform: none;
			}
			.card.top {
				z-index: 6;
			}
			.card.read {
				pointer-events: auto;
			}
			.f3 {
				position: absolute;
				inset: 0;
				transform-style: preserve-3d;
				transform: perspective(1500px);
				transition: transform 1.1s cubic-bezier(0.4, 0.1, 0.2, 1);
			}
			.flip .f3 {
				transform: perspective(1500px) rotateY(180deg);
			}
			.face {
				position: absolute;
				inset: 0;
				box-sizing: border-box;
				padding: clamp(20px, 5vw, 34px);
				background: var(--paper);
				border-radius: 10px;
				box-shadow: 0 26px 50px rgba(50, 25, 0, 0.4);
				backface-visibility: hidden;
				-webkit-backface-visibility: hidden;
				display: flex;
				flex-direction: column;
				justify-content: center;
				text-align: center;
				overflow: auto;
			}
			.face::after {
				content: "";
				position: absolute;
				inset: 9px;
				border: 2px dashed rgba(180, 80, 30, 0.28);
				border-radius: 6px;
				pointer-events: none;
			}
			.fb {
				transform: rotateY(180deg);
				--s: 0.3s;
				--d: 0.8s;
			}
			.flip .fa {
				pointer-events: none;
			}
			.ln {
				opacity: 0;
				transform: translateY(10px);
				transition:
					opacity 0.8s,
					transform 0.8s;
				transition-delay: calc(var(--i) * var(--s, 0.55s) + var(--d, 0s));
			}
			.read .fa .ln,
			.flip .fb .ln {
				opacity: 1;
				transform: none;
			}
			.fa p,
			.fa h1,
			.fb h2,
			.fb h3 {
				margin: 0 0 0.6em;
				font-family: Caveat, "Segoe Print", "Bradley Hand", cursive;
			}
			.fa p {
				font-size: clamp(1.35rem, 5.4vw, 1.75rem);
				line-height: 1.15;
				font-weight: 500;
			}
			.fa .hi {
				color: var(--cu);
				font-weight: 700;
				font-size: clamp(1.9rem, 7vw, 2.4rem);
			}
			.fa h1 {
				font-size: clamp(2.1rem, 8.6vw, 2.9rem);
				line-height: 1;
				color: var(--cu);
				margin: 0.2em 0 0.6em;
			}
			.btns {
				display: flex;
				justify-content: center;
				align-items: center;
				gap: 14px;
				min-height: 68px;
			}
			button {
				font:
					700 1.55rem Caveat,
					"Segoe Print",
					cursive;
				border: 0;
				border-radius: 999px;
				padding: 0.3em 1.3em;
				cursor: pointer;
				transition: all 0.5s;
				white-space: nowrap;
				-webkit-appearance: none;
			}
			button:focus-visible {
				outline: 3px solid var(--cu);
				outline-offset: 3px;
			}
			.yes {
				background: #f2a900;
				color: #3a1e08;
				box-shadow: 0 6px 0 #b97a00;
				scale: var(--g, 1);
			}
			.no {
				background: #f3e3cf;
				color: #7a4a1d;
				box-shadow: 0 6px 0 #c9ae8f;
				max-width: 260px;
			}
			button:active {
				translate: 0 4px;
			}
			.no.x {
				opacity: 0;
				max-width: 0;
				padding-left: 0;
				padding-right: 0;
				margin-left: -14px;
				transform: scale(0.4);
				pointer-events: none;
				overflow: hidden;
			}
			.fb h2 {
				font-size: clamp(2.1rem, 8.8vw, 2.8rem);
				line-height: 1;
				color: var(--cu);
				margin: 0 0 0.2em;
				font-weight: 700;
			}
			.fb h3 {
				font-size: 1.6rem;
				margin: 0.1em 0 0.4em;
				font-weight: 700;
			}
			.fb ol {
				list-style: none;
				counter-reset: n;
				margin: 0 0 0.8em;
				padding: 0;
				text-align: left;
				font-size: clamp(0.82rem, 2.2svh, 0.98rem);
				line-height: 1.4;
			}
			.fb li {
				counter-increment: n;
				display: flex;
				gap: 0.7em;
				margin: 0.5em 0;
			}
			.fb li::before {
				content: counter(n);
				flex: none;
				width: 1.7em;
				height: 1.7em;
				border-radius: 50%;
				background: #f2a900;
				color: #3a1e08;
				font:
					700 1.1rem/1.7em Caveat,
					cursive;
				text-align: center;
			}
			.dt {
				display: flex;
				gap: 8px;
				justify-content: center;
				flex-wrap: wrap;
				font-size: 0.8rem;
				line-height: 1.25;
			}
			.dt span {
				background: #fff0c2;
				border-radius: 10px;
				padding: 0.35em 0.7em;
			}
			.dt b {
				display: block;
				color: var(--cu);
				font:
					700 1.25rem Caveat,
					cursive;
			}
			.ft {
				margin: 0.7em 0 0;
				font:
					700 1.4rem Caveat,
					cursive;
				color: var(--cu);
			}
			.pt {
				position: fixed;
				left: 0;
				top: 0;
				z-index: 9;
				pointer-events: none;
			}
		</style>
	</head>
	<body>
		<svg width="0" height="0" style="position: absolute" aria-hidden="true">
			<defs>
				<ellipse id="pt" cx="50" cy="17" rx="8.5" ry="17" />
				<g id="r6">
					<use href="#pt" />
					<use href="#pt" transform="rotate(60 50 50)" />
					<use href="#pt" transform="rotate(120 50 50)" />
					<use href="#pt" transform="rotate(180 50 50)" />
					<use href="#pt" transform="rotate(240 50 50)" />
					<use href="#pt" transform="rotate(300 50 50)" />
				</g>
				<symbol id="sf" viewBox="0 0 100 100">
					<use href="#r6" fill="#e59b00" />
					<use href="#r6" fill="#e59b00" transform="rotate(30 50 50)" />
					<use href="#r6" fill="#ffc61a" transform="rotate(15 50 50)" />
					<use href="#r6" fill="#ffc61a" transform="rotate(45 50 50)" />
					<circle cx="50" cy="50" r="19" fill="#4e2a10" />
					<circle cx="50" cy="50" r="13" fill="#6f4019" />
				</symbol>
			</defs>
		</svg>

		<div
			id="env"
			tabindex="0"
			role="button"
			aria-label="Open the letter: swipe up or press Enter"
		>
			<div class="p eb"></div>
			<div class="p ef"></div>
			<div class="p fp"></div>
			<div class="to">For <span data-n></span></div>
			<svg class="seal" viewBox="0 0 100 100"><use href="#sf" /></svg>
		</div>
		<div id="hint"><i>↑</i>Grab the letter and swipe up</div>

		<div class="card">
			<div class="f3">
				<section class="face fa">
					<p class="ln hi" style="--i: 0">Dear <span data-n></span>,</p>
					<p class="ln" style="--i: 1">
						Your hair glows like a sunset, and you carry the whole summer around
						with you.
					</p>
					<p class="ln" style="--i: 2">
						So I have one small, very serious question…
					</p>
					<h1 class="ln" style="--i: 3">Will you go on a date with me?</h1>
					<div class="ln btns" style="--i: 4">
						<button class="yes">Yes</button><button class="no">No</button>
					</div>
				</section>
				<section class="face fb">
					<h2 class="ln" style="--i: 0">Invitation to the date</h2>
					<h3 class="ln" style="--i: 1">Requirements:</h3>
					<ol></ol>
					<div class="dt ln" style="--i: 7"></div>
					<p class="ft ln" style="--i: 8">
						RSVP: already accepted. No refunds 🌻
					</p>
				</section>
			</div>
		</div>

		<script>
			// ✏️ Edit the text here
			const CFG = {
				name: "Sunflower girl",
				when: "You pick the day",
				where: "A surprise",
				dress: "Sunny (yellow = bonus)",
				reqs: [
					"Wear something that makes you feel like sunshine.",
					"Bring your best smile, the real one.",
					"Dont take money, you wouldn't need them anyway.",
					"Leave your worries at home, bring the mischief.",
					"Tell me your favourite flower. I have a guess.",
				],
			};
			const $ = (s) => document.querySelector(s),
				env = $("#env"),
				card = $(".card"),
				yes = $(".yes"),
				no = $(".no");
			document
				.querySelectorAll("[data-n]")
				.forEach((e) => (e.textContent = CFG.name));
			$("ol").innerHTML = CFG.reqs
				.map((r, i) => `<li class="ln" style="--i:${i + 2}">${r}</li>`)
				.join("");
			$(".dt").innerHTML = [
				["When", CFG.when],
				["Where", CFG.where],
				["Dress code", CFG.dress],
			]
				.map((a) => `<span><b>${a[0]}</b>${a[1]}</span>`)
				.join("");
			document.body.insertAdjacentHTML(
				"afterbegin",
				Array.from(
					{ length: 9 },
					(_, i) =>
						`<svg class="fl" viewBox="0 0 100 100" style="left:${i * 11 + Math.random() * 6}%;width:${28 + Math.random() * 34}px;animation-duration:${14 + Math.random() * 12}s;animation-delay:-${Math.random() * 20}s"><use href="#sf"/></svg>`,
				).join(""),
			);

			let opened = false,
				y0 = null,
				dy = 0;
			function open() {
				if (opened) return;
				opened = true;
				y0 = null;
				env.classList.remove("drag");
				env.style.top = "0px";
				$("#hint").style.opacity = 0;
				const t = (f, ms) => setTimeout(f, ms),
					c = (n) => () => card.classList.add(n);
				t(() => env.classList.add("open"), 350);
				t(c("pull"), 850);
				t(c("out"), 1450);
				t(c("top"), 1700);
				t(() => env.classList.add("gone"), 1900);
				t(c("read"), 2500);
			}
			env.onpointerdown = (e) => {
				if (opened) return;
				y0 = e.clientY;
				dy = 0;
				env.setPointerCapture(e.pointerId);
				env.classList.add("drag");
			};
			env.onpointermove = (e) => {
				if (y0 === null) return;
				dy = Math.min(0, e.clientY - y0);
				env.style.top = dy + "px";
				if (dy < -120) open();
			};
			env.onpointerup = env.onpointercancel = () => {
				if (y0 === null) return;
				y0 = null;
				env.classList.remove("drag");
				dy < -60 ? open() : (env.style.top = "0px");
			};
			env.onkeydown = (e) => {
				if (["Enter", " ", "ArrowUp"].includes(e.key)) {
					e.preventDefault();
					open();
				}
			};

			const L = ["No", "Are you sure?", "Think maybe again?"];
			let n = 0;
			no.onclick = () => {
				n++;
				yes.style.setProperty("--g", 1 + n * 0.1);
				if (n < 3) no.textContent = L[n];
				else {
					no.classList.add("x");
					no.tabIndex = -1;
					no.setAttribute("aria-hidden", "true");
				}
			};

			yes.onclick = () => {
				if (card.classList.contains("flip")) return;
				const r = card.getBoundingClientRect(),
					x = r.left + r.width / 2,
					y = r.top + r.height / 2;
				for (let i = 0; i < 24; i++) {
					const s = document.createElement("div"),
						z = 26 + Math.random() * 34,
						a = Math.random() * 6.28,
						d = 120 + Math.random() * 220;
					s.className = "pt";
					s.innerHTML = `<svg viewBox="0 0 100 100" width="${z}" height="${z}"><use href="#sf"/></svg>`;
					document.body.append(s);
					s.animate(
						[
							{ transform: `translate(${x}px,${y}px) scale(.3)`, opacity: 1 },
							{
								transform: `translate(${x + Math.cos(a) * d}px,${y + Math.sin(a) * d - 80}px) rotate(${Math.random() * 360}deg) scale(1)`,
								opacity: 0,
							},
						],
						{
							duration: 1400 + Math.random() * 900,
							easing: "cubic-bezier(.1,.7,.3,1)",
						},
					).onfinish = () => s.remove();
				}
				card.classList.add("flip");
			};
		</script>
	</body>
</html>
